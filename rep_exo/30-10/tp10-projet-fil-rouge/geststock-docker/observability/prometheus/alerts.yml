groups:
  - name: shop
    rules:
      - alert: ApiDown
        expr: up{job="api"} == 0 or absent(up{job="api"})
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "API instance {{ $labels.instance }} is down"

      - alert: ApiHigh5xxRate
        expr: |
          sum(rate(http_request_duration_seconds_count{job="api",status=~"5.."}[2m]))
            / sum(rate(http_request_duration_seconds_count{job="api"}[2m])) > 0.05
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "More than 5% of API requests are 5xx ({{ $value | humanizePercentage }})"

      - alert: ApiHighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="api"}[2m]))) > 0.5
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "API p95 latency is {{ $value | humanizeDuration }}"

      # cAdvisor exposes no restart counter (container_start_time_seconds stays constant across a
      # docker restart): use the process start time exported by the apps themselves.
      - alert: ContainerRestarting
        expr: changes(process_start_time_seconds{job=~"api|worker"}[5m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }} {{ $labels.instance }} restarted {{ $value }} time(s) in the last 5 minutes"

      - alert: ContainerMemoryNearLimit
        expr: |
          container_memory_working_set_bytes{name!=""}
            / (container_spec_memory_limit_bytes{name!=""} > 0) > 0.9
        for: 30s
        labels: { severity: warning }
        annotations:
          summary: "Container {{ $labels.name }} uses {{ $value | humanizePercentage }} of its memory limit"
