; Production PHP settings (legacy had display_errors = On "to debug in prod").
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 128M
date.timezone = Europe/Paris
; mail() goes through msmtp to the SMTP relay (Mailpit in dev). Values come from the environment.
sendmail_path = "/usr/bin/msmtp -t --host=${SMTP_HOST} --port=${SMTP_PORT} --from=${MAIL_FROM}"
