# Non-root Apache: listens on 8080 (the www-data user cannot rely on port 80 everywhere).
Listen 8080
ServerName geststock
ServerTokens Prod
ServerSignature Off

<VirtualHost *:8080>
    DocumentRoot /var/www/geststock/public

    <Directory /var/www/geststock/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Photos uploaded by users (volume). Never executed as PHP: an uploaded .php stays inert.
    Alias /uploads /var/www/html/uploads
    <Directory /var/www/html/uploads>
        Options -Indexes
        AllowOverride None
        Require all granted
        php_admin_flag engine off
        <FilesMatch "\.(php|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Logs to the container output (the image links these files to /dev/stdout and /dev/stderr).
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
