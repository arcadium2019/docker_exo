# Shop SAS - base stack shared by dev, CI and prod.
# dev:  docker compose up -d --wait                (compose.override.yml applied automatically)
# prod: docker compose -f compose.yml -f compose.prod.yml up -d --wait
name: shop

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 20s
  start_interval: 1s

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Common settings of the services that read the DB password (api, worker).
x-app: &app
  restart: unless-stopped
  logging: *logging
  secrets: [db_password]
  networks: [back]
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  traefik:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=shop_front
      - --entrypoints.web.address=:80
      - --ping=true
      - --accesslog=true
      # A replica that just stopped has no IP any more: without this, connecting to it waits for the
      # default 30 s dial timeout instead of failing fast and letting the retry middleware switch.
      - --serverstransport.forwardingtimeouts.dialtimeout=300ms
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [front]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "traefik", "healthcheck", "--ping"]
    restart: unless-stopped
    logging: *logging

  api:
    <<: *app
    build: ./apps/shopapi
    # The app only reads DATABASE_URL: build it from the secret at startup, without touching the code.
    command:
      - sh
      - -c
      - export DATABASE_URL="postgres://shop:$$(cat /run/secrets/db_password)@db:5432/shop" && exec node src/server.js
    environment:
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    networks: [front, back]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/ready"]
    # SIGTERM -> the api closes its listener and finishes in-flight requests (TP01), at most 15 s.
    stop_grace_period: 15s
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: Host(`api.localhost`)
      traefik.http.routers.api.entrypoints: web
      traefik.http.routers.api.middlewares: api-retry
      traefik.http.services.api.loadbalancer.server.port: "3000"
      # Traefik only routes to replicas whose /ready answers: a starting or stopping one is skipped.
      traefik.http.services.api.loadbalancer.healthcheck.path: /ready
      traefik.http.services.api.loadbalancer.healthcheck.interval: 2s
      traefik.http.services.api.loadbalancer.healthcheck.timeout: 1s
      # A request sent to a replica that just closed its listener is replayed on another one.
      # The back-off covers the ~2 s Traefik needs to drop a stopped replica (provider throttle).
      traefik.http.middlewares.api-retry.retry.attempts: "5"
      traefik.http.middlewares.api-retry.retry.initialInterval: 100ms

  worker:
    <<: *app
    build: ./apps/shop-worker
    command:
      - sh
      - -c
      - export DATABASE_URL="postgres://shop:$$(cat /run/secrets/db_password)@db:5432/shop" && exec python -m worker.main
    environment:
      REDIS_URL: redis://redis:6379
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=2)"]

  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: shop
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [back]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks: [back]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]
    restart: unless-stopped
    logging: *logging

  # --- on-demand tools ---
  adminer:
    image: adminer:4.8.1
    profiles: [tools]
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks: [front, back]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080') === false ? 1 : 0);"]
    labels:
      traefik.enable: "true"
      traefik.http.routers.adminer.rule: Host(`adminer.localhost`)
      traefik.http.routers.adminer.entrypoints: web
      traefik.http.services.adminer.loadbalancer.server.port: "8080"
    logging: *logging

  # One-shot: MIGRATION=002-add-sku.sql docker compose run --rm migrate
  migrate:
    image: postgres:16.4-alpine
    profiles: [ops]
    command:
      - sh
      - -c
      - PGPASSWORD="$$(cat /run/secrets/db_password)" psql -h db -U shop -d shop -v ON_ERROR_STOP=1 -f "/migrations/$${MIGRATION:?MIGRATION must be set}"
    environment:
      MIGRATION: ${MIGRATION:-}
    secrets: [db_password]
    volumes:
      - ./migrations:/migrations:ro
    networks: [back]
    depends_on:
      db: { condition: service_healthy }

networks:
  front: {}
  back:
    internal: true

volumes:
  pgdata: {}
  redisdata: {}

secrets:
  db_password:
    file: ./secrets/db_password.txt
