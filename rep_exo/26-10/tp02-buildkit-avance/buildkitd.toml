# BuildKit daemon config for the "shop" builder: trust the Shop SAS internal CA (TP03 registry).
# "localhost" defaults to plain HTTP in BuildKit: force HTTPS, the gateway only speaks TLS.
[registry."localhost:5000"]
  http = false
  insecure = false
  ca = ["../tp03-registry-supply-chain/registry/trust/ca.crt"]
[registry."registry.local:5000"]
  ca = ["../tp03-registry-supply-chain/registry/trust/ca.crt"]
