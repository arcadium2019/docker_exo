# TLS + basic auth (bcrypt) + push/pull authorisation in front of the registry.
map $upstream_http_docker_distribution_api_version $docker_distribution_api_version {
  '' 'registry/2.0';
}

# Read-only methods are allowed for every authenticated user; writes only for "ci".
map "$request_method:$remote_user" $write_denied {
  default          1;
  "~^(GET|HEAD):"  0;
  "~^[A-Z]+:ci$"   0;
}

server {
  listen 443 ssl;
  server_name registry.local localhost;

  ssl_certificate     /etc/nginx/certs/registry.crt;
  ssl_certificate_key /etc/nginx/certs/registry.key;
  ssl_protocols       TLSv1.2 TLSv1.3;

  # Image layers can be large: no body limit, stream uploads.
  client_max_body_size 0;
  chunked_transfer_encoding on;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location /v2/ {
    # Docker 1.5 and older clients are not supported.
    if ($http_user_agent ~ "^(docker\/1\.(3|4|5(?!\.[0-9]-dev))|Go ).*$") {
      return 404;
    }

    auth_basic           "Shop SAS registry";
    auth_basic_user_file /etc/nginx/auth/htpasswd;

    if ($write_denied) {
      return 403 '{"errors":[{"code":"DENIED","message":"push requires the ci account"}]}';
    }

    add_header 'Docker-Distribution-Api-Version' $docker_distribution_api_version always;

    proxy_pass                          http://registry:5000;
    proxy_set_header  Host              $http_host;
    proxy_set_header  X-Real-IP         $remote_addr;
    proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header  X-Forwarded-Proto $scheme;
    proxy_read_timeout                  900;
    proxy_request_buffering             off;
  }
}
