# Custom trivy secret rules (in addition to the built-in ones).
rules:
  - id: connection-string-password
    category: general
    title: Password embedded in a connection URL
    severity: CRITICAL
    # scheme://user:password@host  (postgres, mysql, redis, amqp, mongodb...)
    regex: '[a-zA-Z][a-zA-Z0-9+.-]*://[^:/\s"]+:(?P<secret>[^@/\s"]+)@[^\s"]+'
    secret-group-name: secret
    keywords: ["://"]
allow-rules:
  # Third-party code and package caches are full of documentation examples (redis://user:pass@...).
  - id: vendored-code
    description: Skip vendored dependencies and package-manager caches
    path: '(^|/)(node_modules|\.npm/_cacache|site-packages|dist-packages)/'
