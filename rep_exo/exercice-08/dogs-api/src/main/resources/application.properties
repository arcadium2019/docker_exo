spring.application.name=dogs-api

# Defaults target the MySQL container published on localhost:3308 (local development).
# In Docker, they are overridden by the DB_HOST / DB_PORT / ... environment variables.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:dogsdb}
spring.datasource.username=${DB_USER:dogs_user}
spring.datasource.password=${DB_PASSWORD:dogs_pass}

# Hibernate creates / updates the tables from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Include the error message in error responses (e.g. 404 "Dog 42 not found")
spring.web.error.include-message=always
